syntax = "proto3";
package dymensionxyz.dymension.agent;

option go_package = "github.com/dymensionxyz/dymension/v3/x/agent/types";

import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "dymensionxyz/dymension/common/tee.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterAgent registers a new agent with an immutable attestation policy.
  rpc RegisterAgent(MsgRegisterAgent) returns (MsgRegisterAgentResponse);

  // DeactivateAgent deactivates an existing agent. Owner only.
  rpc DeactivateAgent(MsgDeactivateAgent) returns (MsgDeactivateAgentResponse);

  // UpdateAgentPolicy schedules a timelocked rotation of the agent's
  // attestation policy. Owner only. The new policy activates after
  // policy_rotation_delay_blocks.
  rpc UpdateAgentPolicy(MsgUpdateAgentPolicy)
      returns (MsgUpdateAgentPolicyResponse);

  // SubmitAttestedAction verifies a TEE attestation token against the agent's
  // policy, bound by a per-action nonce, and appends an entry to the agent's
  // action log.
  rpc SubmitAttestedAction(MsgSubmitAttestedAction)
      returns (MsgSubmitAttestedActionResponse);

  // FundAgentEscrow deposits funds into an agent's escrow. Anyone may fund.
  rpc FundAgentEscrow(MsgFundAgentEscrow) returns (MsgFundAgentEscrowResponse);

  // WithdrawAgentEscrow withdraws funds from an agent's escrow. Owner only.
  rpc WithdrawAgentEscrow(MsgWithdrawAgentEscrow)
      returns (MsgWithdrawAgentEscrowResponse);

  // UpdateAgentSpendPolicy sets the agent's spend policy (denom, per-window
  // limit, window length). Owner only, effective immediately.
  rpc UpdateAgentSpendPolicy(MsgUpdateAgentSpendPolicy)
      returns (MsgUpdateAgentSpendPolicyResponse);

  // SubmitAttestedTransfer verifies a TEE attestation token bound to a
  // specific (recipient, denom, amount, memo), checks the per-window spend
  // budget, pays out from the agent's escrow, and appends an entry to the
  // agent's action log.
  rpc SubmitAttestedTransfer(MsgSubmitAttestedTransfer)
      returns (MsgSubmitAttestedTransferResponse);

  // RevokePolicy adds a policy fingerprint to the revocation denylist.
  // Governance only.
  rpc RevokePolicy(MsgRevokePolicy) returns (MsgRevokePolicyResponse);

  // UnrevokePolicy removes a policy fingerprint from the revocation denylist.
  // Governance only.
  rpc UnrevokePolicy(MsgUnrevokePolicy) returns (MsgUnrevokePolicyResponse);

  // SubmitFeedback submits or overwrites the client's feedback score for an
  // agent, grounded in an existing action-log entry.
  rpc SubmitFeedback(MsgSubmitFeedback) returns (MsgSubmitFeedbackResponse);

  // RevokeFeedback removes the client's feedback for an agent.
  rpc RevokeFeedback(MsgRevokeFeedback) returns (MsgRevokeFeedbackResponse);
}

message MsgRegisterAgent {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  dymensionxyz.dymension.common.Policy policy = 3
      [ (gogoproto.nullable) = false ];
}

message MsgRegisterAgentResponse {}

message MsgDeactivateAgent {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
}

message MsgDeactivateAgentResponse {}

message MsgUpdateAgentPolicy {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  dymensionxyz.dymension.common.Policy new_policy = 3
      [ (gogoproto.nullable) = false ];
}

message MsgUpdateAgentPolicyResponse { int64 activation_height = 1; }

// MsgSubmitAttestedAction submits an attested action on behalf of an agent.
// The submitter signs and pays for the tx but is not validated against the
// agent: the enclave token authorizes the content, so any account may submit a
// valid attested action.
message MsgSubmitAttestedAction {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  bytes payload = 3;
  string token = 4;
}

message MsgSubmitAttestedActionResponse { uint64 seq = 1; }

message MsgFundAgentEscrow {
  option (cosmos.msg.v1.signer) = "funder";

  string funder = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  repeated cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

message MsgFundAgentEscrowResponse {}

message MsgWithdrawAgentEscrow {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  repeated cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

message MsgWithdrawAgentEscrowResponse {}

message MsgUpdateAgentSpendPolicy {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  // spend_denom is the single spendable denom; empty disables spending.
  string spend_denom = 3;
  string spend_limit_per_window = 4 [
    (gogoproto.nullable) = false,
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int"
  ];
  uint64 spend_window_blocks = 5;
}

message MsgUpdateAgentSpendPolicyResponse {}

// MsgSubmitAttestedTransfer submits an attested transfer on behalf of an
// agent. Like MsgSubmitAttestedAction, the submitter signs and pays for the tx
// but is not validated against the agent: the enclave token is bound to the
// exact (recipient, denom, amount, memo) via the nonce, so the enclave — not
// the submitter — authorizes the payment.
message MsgSubmitAttestedTransfer {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  string recipient = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string amount = 4 [
    (gogoproto.nullable) = false,
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int"
  ];
  bytes memo = 5;
  string token = 6;
}

message MsgSubmitAttestedTransferResponse { uint64 seq = 1; }

// MsgRevokePolicy revokes a TEE policy by fingerprint: agents pinning it can
// no longer submit attested actions, and new agents cannot register with it.
message MsgRevokePolicy {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the x/gov module account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // fingerprint is the lowercase hex SHA-256 of the deterministic proto
  // marshaling of the policy.
  string fingerprint = 2;
  // reason documents why the policy was revoked (e.g. a CVE identifier).
  string reason = 3;
}

message MsgRevokePolicyResponse {}

// MsgUnrevokePolicy removes a policy fingerprint from the revocation
// denylist, re-enabling agents pinning it. No agent state is touched.
message MsgUnrevokePolicy {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the x/gov module account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // fingerprint is the lowercase hex SHA-256 of the deterministic proto
  // marshaling of the policy.
  string fingerprint = 2;
}

message MsgUnrevokePolicyResponse {}

message MsgSubmitFeedback {
  option (cosmos.msg.v1.signer) = "client";

  string client = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
  // score is fixed-point with 2 decimals: 0..10000 == 0.00%..100.00%.
  uint32 score = 3;
  // tag1 is the primary dimension name, e.g. "liveness". Required.
  string tag1 = 4;
  // tag2 is an optional secondary dimension name.
  string tag2 = 5;
  // evidence_seq must reference an existing action-log entry of the agent.
  uint64 evidence_seq = 6;
}

message MsgSubmitFeedbackResponse {}

message MsgRevokeFeedback {
  option (cosmos.msg.v1.signer) = "client";

  string client = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string agent_id = 2;
}

message MsgRevokeFeedbackResponse {}
