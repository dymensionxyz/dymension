syntax = "proto3";
package dymensionxyz.dymension.agent;

option go_package = "github.com/dymensionxyz/dymension/v3/x/agent/types";

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";

message ValidationRequest {
  bytes request_hash = 1;
  string requester = 2;
  string validator_id = 3;
  string agent_id = 4;
  uint64 evidence_seq = 5;
  string request_uri = 6;
  int64 height = 7;
  google.protobuf.Timestamp time = 8
      [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  uint64 response_count = 9;
  // bounty is held in the module account until claimed by the validator or
  // reclaimed by the requester.
  cosmos.base.v1beta1.Coin bounty = 10 [ (gogoproto.nullable) = false ];
  // bounty_claimed is set once the bounty has been paid out or refunded.
  bool bounty_claimed = 11;
}

message ValidationResponse {
  bytes request_hash = 1;
  uint64 seq = 2;
  uint32 response = 3;
  string response_uri = 4;
  bytes response_hash = 5;
  string tag = 6;
  int64 height = 7;
  google.protobuf.Timestamp time = 8
      [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  // A token verified against the validator's effective policy, exact verdict,
  // subject evidence, and consumed validator action sequence.
  bool attested = 9;
}
